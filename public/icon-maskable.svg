    <circle cx="256" cy="256" r="195" fill="none" stroke="#A3B899" stroke-width="4" stroke-dasharray="8 14" opacity="0.6" />

    <!-- Skillet Body -->
    <circle cx="256" cy="256" r="140" fill="url(#panGradMask)" stroke="#E2DCD2" stroke-width="6" />
    <circle cx="256" cy="256" r="122" fill="#F4EFE6" />

