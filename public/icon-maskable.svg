<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A43" />
      <stop offset="100%" stop-color="#1E3F2E" />
    </linearGradient>
    <linearGradient id="panGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#E8E2D9" />
    </linearGradient>
  </defs>

  <!-- Solid Full-Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner Padded Content (Safe Zone is within radius 180) -->
