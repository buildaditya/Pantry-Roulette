<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A43" />
      <stop offset="100%" stop-color="#1E3F2E" />
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#E8E2D9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring / Roulette Accent Dots -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#A3B899" stroke-width="4" stroke-dasharray="8 14" opacity="0.6" />

  <!-- Skillet Body -->
  <g filter="url(#shadow)">
    <!-- Skillet Rim and Base -->
    <circle cx="256" cy="256" r="140" fill="url(#panGrad)" stroke="#E2DCD2" stroke-width="6" />
    <circle cx="256" cy="256" r="122" fill="#F4EFE6" />

    <!-- Cooking Pan Handle -->
    <path d="M 365 330 L 440 395 C 448 402, 442 414, 432 422 C 424 430, 412 434, 405 428 L 332 365 Z" fill="#D96B43" />
    <circle cx="420" cy="410" r="7" fill="#FAF7F2" />

    <!-- Fresh Botanical & Pantry Elements Inside Pan -->
    <!-- Chef Spoon / Whisk Crossing -->
    <path d="M 210 190 Q 256 240 295 300" stroke="#2D5A43" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Fresh Leaf / Sprout -->
    <path d="M 256 195 C 220 185 205 215 220 238 C 240 260 256 220 256 195 Z" fill="#2D5A43" />
    <path d="M 256 195 C 292 185 307 215 292 238 C 272 260 256 220 256 195 Z" fill="#4B7C60" />
    <path d="M 256 195 L 256 265" stroke="#A3B899" stroke-width="3.5" stroke-linecap="round" />

    <!-- Whimsical Sparkling Stars (Roulette Magic) -->
    <!-- Sparkle 1 (Terracotta) -->
    <path d="M 200 270 Q 200 282 188 282 Q 200 282 200 294 Q 200 282 212 282 Q 200 282 200 270 Z" fill="#D96B43" />
    <!-- Sparkle 2 (Terracotta Gold) -->
    <path d="M 305 205 Q 305 215 295 215 Q 305 215 305 225 Q 305 215 315 215 Q 305 215 305 205 Z" fill="#D96B43" />
    <!-- Sparkle 3 (Sage) -->
    <path d="M 256 288 Q 256 295 249 295 Q 256 295 256 302 Q 256 295 263 295 Q 256 295 256 288 Z" fill="#2D5A43" />
  </g>
</svg>
